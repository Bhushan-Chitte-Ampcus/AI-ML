<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark navy background circle -->
  <circle cx="16" cy="16" r="16" fill="#0a0e1a"/>
  <!-- Outer cyan glow ring -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#00e5ff" stroke-width="1.2" opacity="0.6"/>
  <!-- Microphone body -->
  <rect x="12" y="5" width="8" height="13" rx="4" fill="#00e5ff"/>
  <!-- Microphone stand arc -->
  <path d="M9 15 a7 7 0 0 0 14 0" fill="none" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
  <!-- Stand pole -->
  <line x1="16" y1="22" x2="16" y2="26" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
  <!-- Base line -->
  <line x1="12" y1="26" x2="20" y2="26" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
  <!-- Magenta accent dot (top right) -->
  <circle cx="25" cy="7" r="3" fill="#ff00c8" opacity="0.8"/>
</svg>
