<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="New Ice-Cream Brand - Best selling ice cream made from fresh fruits and milk.">
  <title>New Ice-Cream Brand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Top Banner Header -->
  <header class="header">
    <div class="header-content">
      <h1 class="brand-title">NEW ICE-CREAM BRAND - V2</h1>
      <p class="brand-subtitle">Best selling ice cream brand where we sell ice cream made from fresh fruits and milk.
      </p>
    </div>
  </header>

  <!-- Main Content Showcase -->
  <main class="main-wrapper">
    <section class="showcase-card">
      <div class="gallery-grid">

        <!-- Ice Cream Item 1 -->
        <article class="gallery-item">
          <div class="image-container">
            <img src="images/strawberry-delight.jpg" alt="Fresh Strawberry & Mixed Berry Ice Cream Bowl"
              class="gallery-image" loading="lazy">
            <div class="item-overlay">
              <span class="item-tag">Strawberry Bliss</span>
            </div>
          </div>
        </article>

        <!-- Ice Cream Item 2 -->
        <article class="gallery-item">
          <div class="image-container">
            <img src="images/blueberry-bliss.jpg" alt="Vibrant Blueberry & Citrus Ice Cream Bowl" class="gallery-image"
              loading="lazy">
            <div class="item-overlay">
              <span class="item-tag">Wild Blueberry Scoop</span>
            </div>
          </div>
        </article>

        <!-- Ice Cream Item 3 -->
        <article class="gallery-item">
          <div class="image-container">
            <img src="images/citrus-berry.jpg" alt="Fresh Fruit Gelato with Mint & Berries" class="gallery-image"
              loading="lazy">
            <div class="item-overlay">
              <span class="item-tag">Citrus Mint Splash</span>
            </div>
          </div>
        </article>

        <!-- Ice Cream Item 4 -->
        <article class="gallery-item">
          <div class="image-container">
            <img src="images/vanilla-swirl.jpg" alt="Creamy Berry Swirl Ice Cream Bowl" class="gallery-image"
              loading="lazy">
            <div class="item-overlay">
              <span class="item-tag">Creamy Berry Swirl</span>
            </div>
          </div>
        </article>

      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 New Ice-Cream Brand. 100% All-Natural Dairy & Real Fruits.</p>
  </footer>

</body>

</html>
