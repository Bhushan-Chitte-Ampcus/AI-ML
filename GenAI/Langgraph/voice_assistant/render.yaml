services:
  - type: web
    name: cortexai-voice-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # you fill this in Render dashboard
      - key: GROQ_MODEL
        value: llama3-groq-70b-8192-tool-use-preview
      - key: MAX_HISTORY_MESSAGES
        value: "20"
      - key: ALPHA_VANTAGE_API_KEY
        sync: false          # optional — for stock prices
      - key: DATABASE_URL
        sync: false          # paste your Neon connection string here
    healthCheckPath: /api/health
